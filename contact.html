<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Kylan Technologies</title>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-FVD02B7R1M"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-FVD02B7R1M');
        </script>
        <style>
:root {
  --accent-color: #DCA1A1;
  --bg-color: rgba(250,244,240,0.95);
  --card-bg: #FFFFFF;
  --text-color: #4B4B4B;
}

body {
  margin: 0;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: rgba(0,0,0,0.4); /* semi-dark overlay */
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Modal Container */
.modal-container {
  background: var(--card-bg);
  padding: 2.5rem;
  border-radius: 15px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  position: relative;
}

/* Close Button */
.close-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 2rem;
  font-weight: bold;
  color: #888;
  cursor: pointer;
  transition: color 0.2s ease;
}
.close-btn:hover {
  color: var(--accent-color);
}

/* Heading & Text */
.modal-container h2 {
  color: var(--accent-color);
  margin-top: 0;
}
.modal-container p {
  margin-bottom: 1.5rem;
  color: #5A4B44;
}

/* Form Fields */
.modal-container input,
.modal-container textarea {
  width: 100%;
  padding: 0.75rem;
  margin-bottom: 1rem;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-family: inherit;
  box-sizing: border-box;
}

.modal-container button {
  width: 100%;
  padding: 0.75rem;
  background-color: var(--accent-color);
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s ease;
}
.modal-container button:hover {
  background-color: #c78b8b;
}

/* Response Message */
.form-response {
  margin-top: 1rem;
  display: none;
}

/* Full-screen overlay */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

</style>
    </head>
    <body>

        <!-- Overlay -->
        <div id="overlay" class="overlay">
            <!-- Modal Content -->
            <div class="modal-container">
                <span class="close-btn">&times;</span>
                <h2>Contact Kylan Technologies</h2>
                <p>Fill out the form and we’ll get back to you shortly.</p>

                <form id="contactForm">
                    <input type="text" name="name" placeholder="Your Name"
                        required>
                    <input type="email" name="email" placeholder="Your Email"
                        required>
                    <textarea name="message" placeholder="Your Message" rows="5"
                        required></textarea>
                    <button type="submit">Send</button>
                </form>

                <div class="form-response"></div>
            </div>
        </div>

<script>
const form = document.getElementById('contactForm');
const overlay = document.getElementById('overlay');
const closeBtn = document.querySelector('.close-btn');

closeBtn.addEventListener('click', () => {
  window.location.href = 'index.html';
});

overlay.addEventListener('click', e => {
  if (e.target === overlay) window.location.href = 'index.html';
});

form.addEventListener('submit', e => {
  e.preventDefault();
  
  const name = form.name.value.trim();
  const email = form.email.value.trim();
  const message = form.message.value.trim();

  // Construct the mailto URL
  const subject = encodeURIComponent(`Message from ${name}`);
  const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
  const mailtoLink = `mailto:reina@kylantech.com?subject=${subject}&body=${body}`;

  // Open the email client
  window.location.href = mailtoLink;

  // Optional: redirect to homepage after opening email client
  setTimeout(() => {
    window.location.href = 'index.html';
  }, 500);
});
</script>

    </body>

</html>
